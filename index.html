@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
*{font-family:Inter,system-ui,sans-serif}
.glass-card{
  background: rgba(18,18,28,0.85);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 28px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 10px 40px rgba(0,0,0,0.5), 0 0 60px rgba(124,58,237,0.08);
}
.glass-card:hover{ box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 20px 60px rgba(0,0,0,0.6), 0 0 80px rgba(124,58,237,0.12); }
.shimmer-btn{ position:relative; overflow:hidden }
.shimmer-btn::after{
  content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: shimmer 2.5s infinite;
}
@keyframes shimmer{ 100%{ left:100% } }
.orb-wrap{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; width:100vw; height:100vh; max-width:100vw; }
.orb{
  position:absolute; width:400px; height:400px; border-radius:50%;
  filter: blur(120px); opacity:0.15; pointer-events:none;
}
.orb1{ background:#7c3aed; top:-80px; left:-10%; animation: float1 12s infinite alternate; }
.orb2{ background:#06b6d4; top:30%; right:-5%; animation: float2 14s infinite alternate; }
.orb3{ background:#ec4899; bottom:-100px; left:30%; animation: float3 16s infinite alternate; }
@keyframes float1{ 0%{ transform:translate(0,0) } 100%{ transform:translate(40px,60px) } }
@keyframes float2{ 0%{ transform:translate(0,0) } 100%{ transform:translate(-30px,50px) } }
@keyframes float3{ 0%{ transform:translate(0,0) } 100%{ transform:translate(20px,-40px) } }
.scrollbar-none::-webkit-scrollbar{ display:none }
.animate-in{ animation: pop .25s ease-out }
@keyframes pop{ 0%{ transform: translateY(20px) scale(.96); opacity:0 } 100%{ transform: translateY(0) scale(1); opacity:1 } }
